name: localdrop
description: Local network file transfer hub — phone runs HTTP server, browsers connect.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  flutter_foreground_task: ^8.17.0
  qr_flutter: ^4.1.0
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  network_info_plus: ^6.1.3
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.5
  path: any
  mime: ^2.0.0
  crypto: ^3.0.6
  uuid: ^4.5.1
  archive: ^3.6.1
  intl: ^0.19.0
  open_settings_plus: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/
