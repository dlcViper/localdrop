def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'

def keystorePropertiesMap = keystoreProperties

android {
    namespace "com.localdrop.app"
    compileSdkVersion localProperties.getProperty('flutter.compileSdkVersion')?.toInteger() ?: 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    defaultConfig {
        applicationId "com.localdrop.app"
        minSdkVersion localProperties.getProperty('flutter.minSdkVersion')?.toInteger() ?: 21
        targetSdkVersion localProperties.getProperty('flutter.targetSdkVersion')?.toInteger() ?: 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            keyAlias keystorePropertiesMap['keyAlias'] ?: 'localdrop'
            keyPassword keystorePropertiesMap['keyPassword'] ?: 'localdrop123'
            storeFile file(keystorePropertiesMap['storeFile'] ?: 'release.keystore')
            storePassword keystorePropertiesMap['storePassword'] ?: 'localdrop123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
